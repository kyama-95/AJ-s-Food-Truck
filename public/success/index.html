<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Request Sent</title>
    <meta
      name="description"
      content="Thanks for reaching out to AJ’s Beef Supply. We’ll get back to you shortly."
    />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #111111;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 20px;
        color: #4b5563;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 12px 18px;
        background: #111111;
        color: #ffffff;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Thanks for the booking request.</h1>
        <p>We received your message and will follow up soon.</p>
        <a href="/">Back to AJ’s Beef Supply</a>
      </div>
    </div>
  </body>
</html>
